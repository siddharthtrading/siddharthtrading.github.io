<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Siddharth Trading | Official Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px;

      background:
        radial-gradient(circle at 50% 18%,
          rgba(0, 255, 136, 0.10),
          transparent 28%),
        linear-gradient(
          rgba(5, 8, 7, 0.90),
          rgba(5, 8, 7, 0.97)
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 54px,
          rgba(0,255,136,0.025) 55px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 54px,
          rgba(0,255,136,0.025) 55px
        ),
        #050706;

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;

      background:
        linear-gradient(
          115deg,
          transparent 10%,
          transparent 28%,
          rgba(0,255,136,0.16) 28.3%,
          transparent 28.7%,
          transparent 46%,
          rgba(0,255,136,0.11) 46.3%,
          transparent 46.7%,
          transparent 65%,
          rgba(0,255,136,0.13) 65.3%,
          transparent 65.7%
        );
    }

    .container {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 460px;
      text-align: center;

      padding: 30px 20px;

      background: rgba(10, 13, 12, 0.58);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.55),
        0 0 45px rgba(0,255,136,0.04);

      backdrop-filter: blur(4px);
    }

    .profile-photo {
      width: 130px;
      height: 130px;

      margin: 0 auto 18px;

      border-radius: 50%;
      object-fit: cover;
      object-position: center;

      border: 3px solid #00d875;

      box-shadow:
        0 0 0 5px rgba(0,216,117,0.08),
        0 0 30px rgba(0,216,117,0.25);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .professional {
      color: #00e67f;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .experience {
      display: inline-block;

      font-size: 14px;
      font-weight: 600;

      color: #e7e7e7;

      padding: 8px 15px;
      margin-bottom: 12px;

      border: 1px solid rgba(0,230,127,0.30);
      border-radius: 50px;

      background: rgba(0,230,127,0.06);
    }

    .subtitle {
      color: #9e9e9e;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .link {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 17px 20px;
      margin: 13px 0;

      color: #ffffff;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      background: rgba(22, 24, 23, 0.94);

      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 14px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: rgba(0,230,127,0.55);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.35),
        0 0 18px rgba(0,230,127,0.08);
    }

    .telegram {
      border-left: 4px solid #27a7e7;
    }

    .instagram {
      border-left: 4px solid #e1306c;
    }

    .youtube {
      border-left: 4px solid #ff0000;
    }

    .footer {
      margin-top: 27px;
      color: #686868;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 14px;
      }

      .container {
        padding: 26px 16px;
        border-radius: 20px;
      }

      .profile-photo {
        width: 115px;
        height: 115px;
      }

      h1 {
        font-size: 24px;
      }

      .professional {
        font-size: 14px;
      }

      .experience {
        font-size: 13px;
      }

      .link {
        padding: 16px 15px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      src="Neon Trading Portrait Avatar.png"
      alt="Siddharth Trading"
      class="profile-photo"
    >

    <h1>SIDDHARTH TRADING</h1>

    <div class="professional">
      Professional Trader
    </div>

    <div class="experience">
      7+ Years of Trading Experience
    </div>

    <div class="subtitle">
      Official Social Media Links
    </div>

    <a
      class="link telegram"
      href="https://t.me/+jJuj1PKbF9A0OTQ1"
      target="_blank"
      rel="noopener noreferrer"
    >
      ✈️ Join Telegram
    </a>

    <a
      class="link instagram"
      href="https://www.instagram.com/quotexwithsiddharth"
      target="_blank"
      rel="noopener noreferrer"
    >
      📸 Follow on Instagram
    </a>

    <a
      class="link youtube"
      href="https://youtube.com/@sktradingclub7"
      target="_blank"
      rel="noopener noreferrer"
    >
      ▶️ Subscribe on YouTube
    </a>

    <div class="footer">
      © 2026 Siddharth Trading
    </div>

  </div>

</body>
</html>
