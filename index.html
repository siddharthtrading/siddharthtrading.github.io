<!DOCTYPE html>

<head>

  <title>Siddharth Trader | Quotex Trading & Trading Strategies</title>
<meta name="description" content="Siddharth Trader - Learn Quotex trading strategies, binary options trading concepts, market analysis, risk management and trading education.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px;

      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(0, 255, 136, 0.10),
          transparent 28%
        ),
        linear-gradient(
          rgba(5, 8, 7, 0.90),
          rgba(5, 8, 7, 0.97)
        ),
        repeating-linear-gradient(
          105deg,
          transparent 0px,
          transparent 95px,
          rgba(0, 255, 136, 0.035) 97px,
          transparent 100px
        ),
        #050807;
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 30px 20px 28px;

      background: rgba(8, 13, 11, 0.78);
      border: 1px solid rgba(0, 255, 136, 0.14);
      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        0 0 45px rgba(0, 255, 136, 0.04);
    }

    .profile-photo {
      width: 125px;
      height: 125px;
      margin: 0 auto 20px;

      border-radius: 50%;
      object-fit: cover;
      object-position: center;

      border: 3px solid #00ff88;

      box-shadow:
        0 0 0 5px rgba(0, 255, 136, 0.12),
        0 0 24px rgba(0, 255, 136, 0.35);
    }

    h1 {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .profession {
      color: #00f58a;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.2px;
      margin-bottom: 9px;
    }

    .experience {
      display: inline-block;
      padding: 8px 17px;
      margin-bottom: 16px;

      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 999px;

      color: #ffffff;
      background: rgba(0, 255, 136, 0.07);

      font-size: 13px;
      font-weight: 700;
    }

    .subtitle {
      color: #a8aaa9;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .link {
      width: 100%;
      min-height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;

      margin-bottom: 14px;
      padding: 15px 20px;

      text-decoration: none;
      color: #ffffff;

      background: #151716;
      border: 1px solid #333735;
      border-radius: 14px;

      font-size: 16px;
      font-weight: 700;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: #1b1e1c;
      border-color: #00d978;
    }

    .icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: block;
    }

    .telegram {
      border-left: 4px solid #229ED9;
    }

    .instagram {
      border-left: 4px solid #E1306C;
    }

    .youtube {
      border-left: 4px solid #FF0000;
    }

    .footer {
      margin-top: 28px;
      color: #666c69;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px 14px;
      }

      .container {
        padding: 27px 16px 24px;
        border-radius: 20px;
      }

      .profile-photo {
        width: 112px;
        height: 112px;
      }

      h1 {
        font-size: 25px;
      }

      .profession {
        font-size: 15px;
      }

      .link {
        min-height: 60px;
        font-size: 15px;
      }

      .icon {
        width: 26px;
        height: 26px;
      }
    }
