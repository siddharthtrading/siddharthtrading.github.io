<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siddharth Trading | Official Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #29d46f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      color: #29d46f;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 17px 20px;
      margin: 14px 0;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
      background: #151515;
      border: 1px solid #303030;
      transition: 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: #29d46f;
      background: #1c1c1c;
    }

    .telegram {
      border-left: 4px solid #229ED9;
    }

    .instagram {
      border-left: 4px solid #E1306C;
    }

    .youtube {
      border-left: 4px solid #FF0000;
    }

    .footer {
      margin-top: 30px;
      color: #666;
      font-size: 12px;
    }
  </style>
